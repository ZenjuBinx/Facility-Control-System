<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Control</title>

    <!-- Bootstrap -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Main CSS -->

    <link rel="stylesheet" href="css/style.css" />

    <!-- Dashboard CSS -->

    <link rel="stylesheet" href="css/dashboard.css" />
  </head>

  <body>
    <!-- Top Navbar -->

    <nav class="navbar navbar-dark px-4">
      <div class="d-flex align-items-center">
        <img
          src="images/TCC.jpg"
          class="tcc-logo"
          alt="Torres Capitol College"
        />

        <span class="navbar-brand mb-0 h1 ms-3">
          Facility Electrical Control System
        </span>
      </div>
    </nav>

    <!-- Main Layout -->

    <div class="container-fluid">
      <div class="row">
        <!-- Sidebar -->

        <div class="col-lg-2 col-md-3 sidebar">
          <h5 class="mt-4 mb-4">Navigation</h5>

          <a href="dashboard.html">
            <i class="bi bi-speedometer2"></i>

            Dashboard
          </a>

          <a href="monitoring.html">
            <i class="bi bi-activity"></i>

            Monitoring
          </a>

          <a href="control.html" class="active">
            <i class="bi bi-lightbulb"></i>

            Control
          </a>

          <a href="reports.html">
            <i class="bi bi-file-earmark-bar-graph"></i>

            Reports
          </a>

          <a href="settings.html">
            <i class="bi bi-gear"></i>

            Settings
          </a>
        </div>

        <!-- Main Content -->

        <div class="col-lg-10 col-md-9 content">
          <h2>Electrical Control</h2>

          <p>Control the electrical loads of each facility area.</p>

          <hr />

          <!-- Building Control -->

          <div id="buildingControlContainer">
            <div class="text-center py-5 text-muted">
              <div class="spinner-border mb-3" role="status"></div>

              <p>Loading facility structure...</p>
            </div>
          </div>
          <!-- Add / Manage Room Modal -->
          <div
            class="modal fade"
            id="roomManagementModal"
            tabindex="-1"
            aria-labelledby="roomManagementModalLabel"
            aria-hidden="true"
          >
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title" id="roomManagementModalLabel">
                    Manage Facility
                  </h5>

                  <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                  ></button>
                </div>

                <div class="modal-body">
                  <p class="text-muted">Choose an action for this facility.</p>

                  <button
                    type="button"
                    class="btn btn-success w-100 mb-2"
                    id="addRoomButton"
                  >
                    <i class="bi bi-plus-circle"></i>
                    Add Room
                  </button>

                  <button
                    type="button"
                    class="btn btn-outline-primary w-100"
                    id="manageLoadsButton"
                  >
                    <i class="bi bi-pencil-square"></i>
                    Manage Loads
                  </button>
                </div>
              </div>
            </div>
          </div>
          <!-- Add Room Modal -->
          <div
            class="modal fade"
            id="addRoomModal"
            tabindex="-1"
            aria-labelledby="addRoomModalLabel"
            aria-hidden="true"
          >
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title" id="addRoomModalLabel">
                    Add New Room
                  </h5>

                  <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                  ></button>
                </div>

                <div class="modal-body">
                  <!-- Floor Selection -->
                  <div class="mb-3" id="newRoomFloorOption">
                    <label for="newRoomFloor" class="form-label"> Floor </label>

                    <select id="newRoomFloor" class="form-select">
                      <option value="floor-1">Floor 1</option>

                      <option value="floor-2">Floor 2</option>

                      <option value="floor-3">Floor 3</option>
                    </select>
                  </div>

                  <!-- Room Name -->
                  <div class="mb-3">
                    <label for="newRoomName" class="form-label">
                      Room Name
                    </label>

                    <input
                      type="text"
                      class="form-control"
                      id="newRoomName"
                      placeholder="Enter room name"
                    />
                  </div>

                  <!-- Electrical Loads -->
                  <label class="form-label"> Electrical Loads </label>

                  <div class="form-check mb-2">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="newRoomLights"
                      checked
                    />

                    <label class="form-check-label" for="newRoomLights">
                      Lights
                    </label>
                  </div>

                  <div class="form-check mb-3" id="newRoomOutletOption">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      id="newRoomOutlets"
                    />

                    <label class="form-check-label" for="newRoomOutlets">
                      Outlet
                    </label>
                  </div>

                  <div id="addRoomMessage" class="mt-3"></div>
                </div>

                <div class="modal-footer">
                  <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                  >
                    Cancel
                  </button>

                  <button
                    type="button"
                    class="btn btn-success"
                    id="confirmAddRoomButton"
                  >
                    <i class="bi bi-plus-circle"></i>
                    Add Room
                  </button>
                </div>
              </div>
            </div>
          </div>
          <!-- Manage Loads Modal -->
          <div
            class="modal fade"
            id="manageLoadsModal"
            tabindex="-1"
            aria-labelledby="manageLoadsModalLabel"
            aria-hidden="true"
          >
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title" id="manageLoadsModalLabel">
                    Manage Electrical Loads
                  </h5>

                  <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                  ></button>
                </div>

                <div class="modal-body">
                  <!-- Room Selection -->
                  <div class="mb-3">
                    <label for="manageRoomSelect" class="form-label">
                      Room / Area
                    </label>

                    <select id="manageRoomSelect" class="form-select"></select>
                  </div>

                  <!-- Load Selection -->
                  <div class="mb-3">
                    <label for="manageLoadSelect" class="form-label">
                      Electrical Load
                    </label>

                    <select id="manageLoadSelect" class="form-select"></select>
                  </div>

                  <!-- Load Name -->
                  <div class="mb-3">
                    <label for="manageLoadName" class="form-label">
                      Load Name
                    </label>

                    <input
                      type="text"
                      id="manageLoadName"
                      class="form-control"
                      placeholder="Enter load name"
                    />
                  </div>

                  <div id="manageLoadMessage" class="mt-3"></div>
                </div>

                <div class="modal-footer">
                  <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                  >
                    Cancel
                  </button>

                  <button
                    type="button"
                    class="btn btn-primary"
                    id="saveManagedLoadButton"
                  >
                    <i class="bi bi-save"></i>
                    Save Changes
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/script.js"></script>

    <script type="module" src="js/firebase.js"></script>
  </body>
</html>
