<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Settings</title>

    <!-- Bootstrap -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Main CSS -->

    <link rel="stylesheet" href="css/style.css" />

    <!-- Dashboard CSS -->

    <link rel="stylesheet" href="css/dashboard.css" />
  </head>

  <body>
    <!-- Top Navbar -->

    <nav class="navbar navbar-dark px-4">
      <div class="d-flex align-items-center">
        <img
          src="images/TCC.jpg"
          class="tcc-logo"
          alt="Torres Capitol College"
        />

        <span class="navbar-brand mb-0 h1 ms-3">
          Facility Electrical Control System
        </span>
      </div>
    </nav>

    <!-- Main Layout -->

    <div class="container-fluid">
      <div class="row">
        <!-- Sidebar -->

        <div class="col-lg-2 col-md-3 sidebar">
          <h5 class="mt-4 mb-4">Navigation</h5>

          <a href="dashboard.html">
            <i class="bi bi-speedometer2"></i>

            Dashboard
          </a>

          <a href="monitoring.html">
            <i class="bi bi-activity"></i>

            Monitoring
          </a>

          <a href="control.html">
            <i class="bi bi-lightbulb"></i>

            Control
          </a>

          <a href="reports.html">
            <i class="bi bi-file-earmark-bar-graph"></i>

            Reports
          </a>

          <a href="settings.html" class="active">
            <i class="bi bi-gear"></i>

            Settings
          </a>

          <button
            type="button"
            class="btn btn-outline-danger w-100 mt-3"
            onclick="logoutUser()"
          >
            <i class="bi bi-box-arrow-right"></i>
            Logout
          </button>
        </div>

        <!-- Main Content -->

        <div class="col-lg-10 col-md-9 content">
          <h2>Settings</h2>

          <p>Manage system preferences and configuration.</p>

          <hr />

          <!-- System Settings -->

          <div class="card mb-4">
            <div class="card-body">
              <h4 class="mb-4">System Settings</h4>

              <div class="row mb-3">
                <label class="col-md-3 col-form-label"> System Name </label>

                <div class="col-md-9">
                  <input
                    type="text"
                    class="form-control"
                    value="Facility Electrical Control System"
                  />
                </div>
              </div>

              <div class="row mb-3">
                <label class="col-md-3 col-form-label"> Administrator </label>

                <div class="col-md-9">
                  <input
                    type="text"
                    class="form-control"
                    value="Administrator"
                  />
                </div>
              </div>

              <div class="row mb-3">
                <label class="col-md-3 col-form-label"> Update Interval </label>

                <div class="col-md-9">
                  <select class="form-select">
                    <option>1 second</option>

                    <option selected>5 seconds</option>

                    <option>10 seconds</option>

                    <option>30 seconds</option>
                  </select>
                </div>
              </div>

              <button class="btn btn-primary">
                <i class="bi bi-save"></i>

                Save Settings
              </button>
            </div>
          </div>

          <!-- Notification Settings -->

          <div class="card mb-4">
            <div class="card-body">
              <h4 class="mb-4">Notification Settings</h4>

              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" checked />

                <label class="form-check-label"> Energy alerts </label>
              </div>

              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" checked />

                <label class="form-check-label"> Connection alerts </label>
              </div>

              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" />

                <label class="form-check-label"> High current alerts </label>
              </div>
            </div>
          </div>

          <!-- System Information -->

          <div class="card">
            <div class="card-body">
              <h4 class="mb-4">System Information</h4>

              <div class="system-info">
                <div>
                  <span> Version </span>

                  <strong> 1.0 </strong>
                </div>

                <div>
                  <span> Controller </span>

                  <strong> ESP32 </strong>
                </div>

                <div>
                  <span> Database </span>

                  <strong> Firebase </strong>
                </div>

                <div>
                  <span> Connection </span>

                  <strong class="text-success">
                    <i class="bi bi-circle-fill"></i>

                    Wi-Fi
                  </strong>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="js/script.js"></script>

    <script type="module" src="js/firebase.js"></script>

    <script type="module" src="js/auth-guard.js"></script>
  </body>
</html>
