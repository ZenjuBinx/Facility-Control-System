<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Facility Electrical Control System</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="container-fluid vh-100">
      <div class="row h-100">
        <!-- LEFT PANEL -->

        <div class="col-lg-7 left-panel d-none d-lg-flex">
          <div class="left-content text-center">
            <img
              src="images/TCC.jpg"
              class="login-logo"
              alt="Torres Capitol College"
            />

            <h1 class="system-title">
              Facility Electrical<br />
              Control System
            </h1>

            <p class="system-subtitle">
              IoT-Based Centralized Facility Electrical Control and Monitoring
              System
            </p>

            <div class="version">
              Version 1.0

              <br />

              © 2026 Torres Capitol College, Inc.
            </div>
          </div>
        </div>

        <!-- RIGHT PANEL -->

        <div class="col-lg-5 d-flex justify-content-center align-items-center">
          <div class="login-card">
            <h2 class="text-center mb-4">Welcome Back</h2>

            <p class="text-center text-muted mb-4">Sign in to continue</p>

            <!-- Username -->

            <div class="input-group mb-3">
              <span class="input-group-text">
                <i class="bi bi-person-fill"></i>
              </span>

              <input type="text" class="form-control" placeholder="Username" />
            </div>

            <!-- Password -->

            <div class="input-group mb-3">
              <span class="input-group-text">
                <i class="bi bi-lock-fill"></i>
              </span>

              <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Password"
              />

              <button
                class="btn btn-outline-secondary"
                type="button"
                onclick="togglePassword()"
              >
                <i class="bi bi-eye-fill"></i>
              </button>
            </div>

            <!-- Remember -->

            <div class="d-flex justify-content-between mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="remember" />

                <label class="form-check-label" for="remember">
                  Remember Me
                </label>
              </div>

              <a href="#" class="forgot-link"> Forgot Password? </a>
            </div>

            <!-- Login Button -->

            <button class="btn btn-primary w-100 login-btn">Login</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->

    <script src="js/script.js"></script>
  </body>
</html>
