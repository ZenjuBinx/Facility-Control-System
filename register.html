<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Create Account - Facility Electrical Control System</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="container-fluid vh-100">
      <div class="row h-100">
        <!-- LEFT PANEL -->
        <div class="col-lg-7 left-panel d-none d-lg-flex">
          <div class="left-content text-center">
            <img
              src="images/TCC.jpg"
              class="login-logo"
              alt="Torres Capitol College"
            />

            <h1 class="system-title">
              Facility Electrical<br />
              Control System
            </h1>

            <p class="system-subtitle">
              IoT-Based Centralized Facility Electrical Control and Monitoring
              System
            </p>

            <div class="version">
              Version 1.0
              <br />
              © 2026 Torres Capitol College, Inc.
            </div>
          </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="col-lg-5 d-flex justify-content-center align-items-center">
          <div class="login-card">
            <h2 class="text-center mb-2">Create Account</h2>

            <p class="text-center text-muted mb-4">
              Register a new system account
            </p>

            <!-- Full Name -->
            <div class="input-group mb-3">
              <span class="input-group-text">
                <i class="bi bi-person-fill"></i>
              </span>

              <input
                type="text"
                id="registerName"
                class="form-control"
                placeholder="Full Name"
              />
            </div>

            <!-- Email -->
            <div class="input-group mb-3">
              <span class="input-group-text">
                <i class="bi bi-envelope-fill"></i>
              </span>

              <input
                type="email"
                id="registerEmail"
                class="form-control"
                placeholder="Email Address"
              />
            </div>

            <!-- Password -->
            <div class="input-group mb-3">
              <span class="input-group-text">
                <i class="bi bi-lock-fill"></i>
              </span>

              <input
                type="password"
                id="registerPassword"
                class="form-control"
                placeholder="Password"
              />

              <button
                class="btn btn-outline-secondary"
                type="button"
                id="toggleRegisterPassword"
              >
                <i class="bi bi-eye-fill"></i>
              </button>
            </div>

            <!-- Confirm Password -->
            <div class="input-group mb-3">
              <span class="input-group-text">
                <i class="bi bi-shield-lock-fill"></i>
              </span>

              <input
                type="password"
                id="confirmPassword"
                class="form-control"
                placeholder="Confirm Password"
              />
            </div>

            <!-- Message -->
            <div id="registerMessage"></div>

            <!-- Register Button -->
            <button
              id="registerButton"
              class="btn btn-primary w-100 login-btn"
              type="button"
            >
              Create Account
            </button>

            <!-- Login Link -->
            <p class="text-center mt-4 mb-0">
              Already have an account?
              <a href="index.html" class="forgot-link"> Sign In </a>
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Authentication JS -->
    <script type="module" src="js/auth.js"></script>
  </body>
</html>
